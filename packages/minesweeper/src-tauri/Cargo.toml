[package]
name = "MineSweeper"
version = "0.1.0"
description = "MineSweeper Game"
authors = ["Cai Ji"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }
dirs = "5.0"

[features]
steam = ["steamworks"]
default = []

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [] }
tauri-plugin-log = "2.0.0-rc"
steamworks = { version = "0.12.2", optional = true }

# Android-only. This app also ships to Steam and the Microsoft Store, and those builds have no
# business carrying an ads plugin at all -- not even the desktop stub. Scoping the dependency to
# the android target keeps the desktop binaries free of it entirely; the matching capability is
# likewise limited to android (see capabilities/mobile-ads.json).
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-caiji-admob = { path = "../../tauri-plugin-caiji-admob" }
